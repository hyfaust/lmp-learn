<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAMMPS 新手学习教程</title>
  <link rel="icon" type="image/png" href="/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/catppuccin-mocha.min.css" id="hljs-theme">
</head>
<body>
  <div class="app">
    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div>
          <div class="logo">LAMMPS 教程</div>
          <div class="subtitle">分子动力学新手学习</div>
        </div>
      </div>

      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索项目...">
      </div>

      <div class="progress-section">
        <div class="progress-label">
          <span>学习进度</span>
          <span id="progressText">0/12 已完成</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Generated by JS -->
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle">☰</button>
          <span id="topbarTitle">LAMMPS 新手学习教程</span>
        </div>
        <div class="topbar-right">
          <button class="toc-toggle" id="tocToggle" style="display:none">📑 目录</button>
          <button class="complete-btn" id="completeBtn" style="display:none">✓ 标记完成</button>
          <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
        </div>
      </header>

      <div class="content-wrapper">
        <div id="content" class="markdown-body">
          <!-- Welcome content -->
          <div class="welcome" id="welcomeScreen">
            <h1>🧪 LAMMPS 新手学习教程</h1>
            <p>从零开始学习分子动力学模拟，12个循序渐进的实战项目，涵盖从基础概念到高级应用的完整知识体系。</p>
            <div class="welcome-cards">
              <div class="welcome-card" onclick="navigateTo(0)">
                <div class="card-icon">🟢</div>
                <h3>入门基础</h3>
                <p>第一个模拟、单位制、能量最小化 — 3个项目带你入门</p>
              </div>
              <div class="welcome-card" onclick="navigateTo(3)">
                <div class="card-icon">🟡</div>
                <h3>基础操作</h3>
                <p>温度控制、压力控制、分子模拟 — 掌握核心 MD 技术</p>
              </div>
              <div class="welcome-card" onclick="navigateTo(6)">
                <div class="card-icon">🟠</div>
                <h3>中级应用</h3>
                <p>金属体系、晶体缺陷、扩散输运 — 真实材料模拟</p>
              </div>
              <div class="welcome-card" onclick="navigateTo(9)">
                <div class="card-icon">🔴</div>
                <h3>高级应用</h3>
                <p>非平衡MD、自由能计算、Python接口 — 进阶技术</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Table of Contents -->
    <nav class="toc" id="toc"></nav>
  </div>

  <!-- Libraries -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      startup: {
        typeset: false
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
